name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Tests
        run: npm test

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `generate_context!` (en lib.rs, que también compila el MCP) necesita ../dist.
      - name: Frontend (genera dist)
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Formato
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Clippy (app + MCP)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --bins -- -D warnings
      - name: Compilar app y servidor MCP
        run: cargo build --manifest-path src-tauri/Cargo.toml --bins
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
