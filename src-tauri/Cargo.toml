[workspace]
members = [".", "mcp"]
resolver = "2"

[package]
name = "agentboard"
version = "2.0.0"
description = "Coste y actividad de tus agentes de código, en local"
edition = "2021"

[lib]
name = "agentboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
notify = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "parse_line"
harness = false

[[bench]]
name = "ingest_file"
harness = false

[[bench]]
name = "summary_queries"
harness = false
